; PlatformIO project for the Taffy shake toy (ESP32, Arduino framework).
; Device audio contract: PCM16 / 16 kHz / mono WAV on the SD card.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_flags =
  -Wall
  -Wextra
  -Wno-unused-parameter
lib_deps =
  arduino-libraries/Servo@^1.2.2
